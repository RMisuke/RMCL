[package]
name = "rmccc-cli"
version = "0.2.0"
edition = "2021"
description = "RMCCC Command-Line Interface — Minecraft launcher CLI (full backend surface)"

[[bin]]
name = "rmcli"
path = "src/main.rs"

[lib]
name = "rmccc_cli"
path = "src/lib.rs"

[dependencies]
rmccc-core = { workspace = true }
rmccc-instance = { workspace = true }
rmccc-auth = { workspace = true }
rmccc-config = { workspace = true }
rmccc-download = { workspace = true }
rmccc-version = { workspace = true }
rmccc-launch = { workspace = true }
rmccc-modloader = { workspace = true }
rmccc-mods = { workspace = true }
rmccc-error = { workspace = true }
rmccc-plugin = { workspace = true }

clap = { workspace = true }
rustyline = { workspace = true }
shlex = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
sha1 = { workspace = true }
dashmap = { workspace = true }

# 平台系统调用（killpg / setpriority）已收归 `rmccc-platform`，
# 应用层不再直接依赖 libc（指南 §5.7）。

[dev-dependencies]
# Local wiremock-style HTTP stub for mod/version flows without external network.
# Implemented as a tiny std-only helper in tests/helpers to avoid extra deps.
