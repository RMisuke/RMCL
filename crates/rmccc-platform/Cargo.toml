[package]
name = "rmccc-platform"
version = "0.1.0"
edition = "2021"

[dependencies]
rmccc-error = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
sha1 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# WinRT MediaTranscoder：Windows 视频代理后端（目标平台专用，不进入 macOS 产物）。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Media_MediaProperties",
    "Media_Transcoding",
    "Storage",
    "Storage_Streams",
    "Win32_System_WinRT",
] }
