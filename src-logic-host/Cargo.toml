[package]
name = "rmccc-logic-host"
version = "0.1.0"
edition = "2021"

# 独立 helper 进程（ADR-007）。它**不被 Tauri 主程序链接**，因此 wasmi 的体积
# 不会计入 ADR-011 的主可执行文件门禁。
[dependencies]
rmccc-logic = { workspace = true }
rmccc-error = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wasmi = { workspace = true }
