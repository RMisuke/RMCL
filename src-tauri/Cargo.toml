[package]
name = "rmccc"
version = "0.3.3"
edition = "2021"

# 可执行文件按产品名输出（Windows 上即 SNGL.exe）；crate 名保留 rmccc，
# 避免改动 workspace 里所有 `-p rmccc` 的引用。
[[bin]]
name = "SNGL"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# Internal crates
rmccc-core = { workspace = true }
rmccc-tasks = { workspace = true }
rmccc-instance = { workspace = true }
rmccc-error = { workspace = true }
rmccc-auth = { workspace = true }
rmccc-config = { workspace = true }
rmccc-launch = { workspace = true }
rmccc-version = { workspace = true }
rmccc-modloader = { workspace = true }
rmccc-mods = { workspace = true }
rmccc-modpack = { workspace = true }
rmccc-logic = { workspace = true }
rmccc-agent = { workspace = true }
rmccc-llm = { workspace = true }

# External
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
ts-rs = { workspace = true }

# Tauri
tauri = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-single-instance = { workspace = true }

# 平台系统调用（killpg / setpriority）已收归 `rmccc-platform`，
# 应用层不再直接依赖 libc（指南 §5.7）。

# Windows 无边框窗口：关闭 DWM 自带圆角/1px 边框，改由 CSS 绘制。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[dev-dependencies]
# Phase 5：逻辑插件 E2E 测试用 WAT 编译一个最小模块（dev-only）。
wat = "1"
# P2-23：E2E 测试（thirtyfour WebDriver client）。
# 仅 dev 依赖，不影响 release 二进制体积。
# tauri-driver（WebDriver server）为独立二进制，由 CI 用 `cargo install tauri-driver` 安装。
thirtyfour = "0.32"
serde_json = { workspace = true }
