[workspace]
members = [
    "crates/rmccc-error",
    "crates/rmccc-core",
    "crates/rmccc-auth",
    "crates/rmccc-download",
    "crates/rmccc-launch",
    "crates/rmccc-version",
    "crates/rmccc-modloader",
    "crates/rmccc-mods",
    "crates/rmccc-profile",
    "crates/rmccc-config",
    "crates/rmccc-platform",
    "crates/rmccc-plugin",
    "crates/rmccc-dashboard",
    "crates/rmccc-logic",
    "crates/rmccc-agent",
    "crates/rmccc-llm",
    "src-tauri",
    "src-cli",
    "src-logic-host",
]
resolver = "2"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli"] }
# MCP 服务器（ADR-013 S4/S5）：复用 reqwest 依赖树中的 hyper 1.x，启用 server 端，
# 不引入 axum/tower 全家桶（体积红线 ADR-011）。
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server-auto"] }
http-body-util = "0.1"

# Logic plugins (Phase 5, ADR-007): only the helper binary links this.
wasmi = "0.40"

# Crypto & hashing
sha1 = "0.10"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
md-5 = "0.10"

# Archive
zip = { version = "2", default-features = false, features = ["deflate"] }

# Utilities
uuid = { version = "1", features = ["v3", "v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
dirs = "6"
url = "2"
urlencoding = "2"

# CLI
clap = { version = "4", features = ["derive"] }
rustyline = { version = "15", features = ["derive"] }
shlex = "1"

# Concurrency
dashmap = "6"

# System
fs2 = "0.4"
libc = "0.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Type bridge (P2-15)：serde-json-impl + chrono-impl 用于 IPC 类型自动导出到前端 types.ts
ts-rs = { version = "10", features = ["serde-json-impl", "chrono-impl"] }

# Tauri
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-build = { version = "2" }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# Internal crates
rmccc-error = { path = "crates/rmccc-error" }
rmccc-core = { path = "crates/rmccc-core" }
rmccc-auth = { path = "crates/rmccc-auth" }
rmccc-download = { path = "crates/rmccc-download" }
rmccc-launch = { path = "crates/rmccc-launch" }
rmccc-version = { path = "crates/rmccc-version" }
rmccc-modloader = { path = "crates/rmccc-modloader" }
rmccc-mods = { path = "crates/rmccc-mods" }
rmccc-profile = { path = "crates/rmccc-profile" }
rmccc-config = { path = "crates/rmccc-config" }
rmccc-platform = { path = "crates/rmccc-platform" }
rmccc-plugin = { path = "crates/rmccc-plugin" }
rmccc-logic = { path = "crates/rmccc-logic" }
rmccc-dashboard = { path = "crates/rmccc-dashboard" }
rmccc-agent = { path = "crates/rmccc-agent" }
rmccc-llm = { path = "crates/rmccc-llm" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = "s"
strip = true

# Perf audit B1: the kernel's CPU hot paths (SHA1 over hundreds of MB of
# downloads, serde_json parsing of version manifests/asset indexes, zip
# inflate for natives/installers) run 10-30% slower under -Os. These leaf
# packages are small, so -O3 here costs almost nothing against the 20 MiB
# binary-size gate while directly speeding up install/repair/launch.
[profile.release.package.sha1]
opt-level = 3

[profile.release.package.serde_json]
opt-level = 3

[profile.release.package.zip]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3
